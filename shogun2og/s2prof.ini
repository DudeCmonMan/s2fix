[device]
; 1 creates the D3D11 device without D3D11_CREATE_DEVICE_SINGLETHREADED; the overhaul's worker threads need it.
multithreaded_device=1
[s2prof]
; 1 opens a console window that shows the log live.
console=0
; 1 skips the warning shown when the game's engine is not the build s2fix targets (for example, another mod changed it).
ignore_build_check=0
[cpu]
; Which CPUs the game's threads use while Apply Fixes is on: auto (main alone on the best core; the rest on that core's CCD or P-cores when it leaves them 10 CPUs, else on every CPU), a cache group number (0 holds CPU 0), or off (Windows decides; main still gets a core of its own).
ccd=auto
[flipmodel]
; 1 creates the swap chain with the flip model: no compositor copy, no Present stalls. 0 keeps the game's blt model. Read at start.
enabled=1
; Flip-model back buffers, 2 to 4.
buffers=3
; 1 allows tearing (uncapped frame rate, variable refresh in a window) when the system supports it.
tearing=1
; At most this many frames queued (1 to 16), waiting for room after each Present instead of blocking inside it. 0 keeps the 3 Windows queues by default. Read at start.
latency=2
[window]
; 1 runs the game's windowed mode in a borderless window that covers its monitor, at the resolution set in the game's options, scaled to fit. Set the game to windowed, not fullscreen. Read at start.
borderless=0
; 1 keeps the cursor on the game's monitor while the game has focus, so edge scrolling works with several monitors.
clip_cursor=1
[vram]
; 1 gives the game the graphics card's video memory (fixes\vram.dll) instead of the 2.9 GB a 32-bit game is told, up to the 4095 MB the game can count: a larger texture budget. Read at start.
enabled=1
