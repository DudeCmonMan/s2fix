[device]
; 1 creates a multithreaded D3D11 device, which the overhaul's worker threads need.
multithreaded_device=1
[s2prof]
; 1 opens a console window that shows the log live.
console=0
; 1 skips the warning when the game's engine is not the build s2fix targets, such as when another mod changed it.
ignore_build_check=0
[cpu]
; CPUs the game's threads use with Apply Fixes on: auto, a cache group number (0 holds CPU 0), or off (Windows decides).
ccd=auto
[flipmodel]
; 1 uses a flip-model swap chain: no compositor copy, no Present stalls. 0 keeps the game's blt model. Read at start.
enabled=1
; Flip-model back buffers, 2 to 4.
buffers=3
; 1 allows tearing (uncapped frame rate, variable refresh in a window) when the system supports it.
tearing=1
; Most frames queued (1 to 16), waiting after each Present, not inside it. 0 keeps Windows' default of 3. Read at start.
latency=2
[fps]
; Caps the frame rate in battles and the menus, the main menu included: frames a second, a whole number; 0 is no cap. Read at start.
battle_fps_limit=0
; The same on the campaign map.
campaign_fps_limit=0
[window]
; 1 runs the game in a borderless window over its monitor whatever its fullscreen setting, scaled to fit; 0 gives the game its own fullscreen and window. Read at start.
borderless=1
; 1 keeps the cursor on the game's monitor while the game has focus, so edge scrolling works with several monitors.
clip_cursor=1
[campthrottle]
; How many times a second each of your settlements on the campaign map checks whether it can build something (fixes\campthrottle.dll). A whole number, 1 or more; the default is 30. Lower gives more frames on a large empire, and the answer can be up to that fraction of a second old. 0 turns this off and checks every frame, as the game does. Read at start.
hz=30
[camplabels]
; How many times a second the label of each of your settlements on the campaign map checks whether a rebellion is imminent while the camera moves (fixes\camplabels.dll). A whole number, 1 or more; the default is 30. The answer can be up to that fraction of a second old. 0 checks every frame, as the game does. Other factions' labels skip the check either way, since the game discards its answer for them. Read at start.
hz=30
[vram]
; 1 tells the game the card's video memory, up to 4095 MB, not 2.9 GB: a larger texture budget. Read at start.
enabled=1
[fsr]
; 1 adds AMD FSR 3.1 (fixes\fsr.dll) to the game's anti-aliasing options, as anti-aliasing or upscaling; needs a DirectX 11.1 graphics card. Set 0 only if it causes a problem. Read at start.
enabled=1
; FSR's sharpening, from 0 (off) to 1. Read at start.
sharpness=0.5
