[device]
; 1 creates a multithreaded D3D11 device, which the overhaul's worker threads need.
multithreaded_device=1
[s2prof]
; 1 opens a console window that shows the log live.
console=0
; 1 skips the warning when the game's engine is not the build s2fix targets, such as when another mod changed it.
ignore_build_check=0
[cpu]
; CPUs the game's threads use with Apply Fixes on: auto, a cache group number (0 holds CPU 0), or off (Windows decides).
ccd=auto
[flipmodel]
; 1 uses a flip-model swap chain: no compositor copy, no Present stalls. 0 keeps the game's blt model. Read at start.
enabled=1
; Flip-model back buffers, 2 to 4.
buffers=3
; 1 allows tearing (uncapped frame rate, variable refresh in a window) when the system supports it.
tearing=1
; Most frames queued (1 to 16), waiting after each Present, not inside it. 0 keeps Windows' default of 3. Read at start.
latency=2
[window]
; 1 turns the game's windowed mode into a borderless window over its monitor, scaled to fit. Read at start.
borderless=0
; 1 keeps the cursor on the game's monitor while the game has focus, so edge scrolling works with several monitors.
clip_cursor=1
[vram]
; 1 tells the game the card's video memory, up to 4095 MB, not 2.9 GB: a larger texture budget. Read at start.
enabled=1
