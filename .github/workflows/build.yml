name: build-steps

# The build both workflows share: the compilers, the unit tests and both games' zips, uploaded as the
# artifact "s2fix".
# Called by release.yml (every push, pull request and version tag) and pre-release.yml (pre-release tags).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The compilers the releases are built and tested with: WinLibs GCC 16.2.0, POSIX threads, MSVCRT, r2; x86_64 for the
      # Complete Edition, i686 for the original 32-bit game.
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip
      WINLIBS_SHA256: 1b90ec73c96e6905a913746b56fb6b20122422787029810d3afc6a3b440f2322
      WINLIBS_I686_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip
      WINLIBS_I686_SHA256: f1fab67fbe6ed1b0a390d06db6af8b4f0ca25fceab4f51bac2a88af8b81a93ec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the compilers
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "$WINLIBS_URL"
          echo "$WINLIBS_SHA256  $RUNNER_TEMP/winlibs.zip" | sha256sum -c -
          7z x -y -bd -o"$RUNNER_TEMP/winlibs" "$RUNNER_TEMP/winlibs.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/winlibs/mingw64/bin" >> "$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/winlibs-i686.zip" "$WINLIBS_I686_URL"
          echo "$WINLIBS_I686_SHA256  $RUNNER_TEMP/winlibs-i686.zip" | sha256sum -c -
          7z x -y -bd -o"$RUNNER_TEMP/winlibs-i686" "$RUNNER_TEMP/winlibs-i686.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/winlibs-i686/mingw32/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -Ishogun2ce -o "$RUNNER_TEMP/test_itemsort_ce.exe" shogun2ce/tests/test_itemsort.c
          "$RUNNER_TEMP/test_itemsort_ce.exe"
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -msse2 -mfpmath=sse -mmemcpy-strategy=vector_loop:512:noalign,libcall:-1:noalign -Ishogun2og -o "$RUNNER_TEMP/test_itemsort_og.exe" shogun2og/tests/test_itemsort.c
          "$RUNNER_TEMP/test_itemsort_og.exe"
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -msse2 -mfpmath=sse -Ishogun2og -o "$RUNNER_TEMP/test_entrysort_og.exe" shogun2og/tests/test_entrysort.c
          "$RUNNER_TEMP/test_entrysort_og.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -Ishogun2ce -o "$RUNNER_TEMP/test_cpupick_ce.exe" shogun2ce/tests/test_cpupick.c
          "$RUNNER_TEMP/test_cpupick_ce.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -D__USE_MINGW_ANSI_STDIO=1 -static -Ishogun2ce -o "$RUNNER_TEMP/test_overhaul_ce.exe" shogun2ce/tests/test_overhaul.c -lntdll -lsynchronization
          "$RUNNER_TEMP/test_overhaul_ce.exe"
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -D__USE_MINGW_ANSI_STDIO=1 -static -msse2 -mfpmath=sse -ffp-contract=off -mstackrealign -mmemcpy-strategy=vector_loop:512:noalign,libcall:-1:noalign -Ishogun2og -o "$RUNNER_TEMP/test_overhaul_og.exe" shogun2og/tests/test_overhaul.c -lntdll -lsynchronization
          "$RUNNER_TEMP/test_overhaul_og.exe"
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -Ishogun2og -o "$RUNNER_TEMP/test_cpupick_og.exe" shogun2og/tests/test_cpupick.c
          "$RUNNER_TEMP/test_cpupick_og.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -Ishogun2ce -o "$RUNNER_TEMP/test_pathsplit_ce.exe" shogun2ce/tests/test_pathsplit.c -lsynchronization
          "$RUNNER_TEMP/test_pathsplit_ce.exe"
          i686-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -msse2 -mfpmath=sse -Ishogun2og -o "$RUNNER_TEMP/test_pathsplit_og.exe" shogun2og/tests/test_pathsplit.c -lsynchronization
          "$RUNNER_TEMP/test_pathsplit_og.exe"

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}" ./package.sh
          sha256sum dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s2fix
          path: dist/*.zip
          if-no-files-found: error
