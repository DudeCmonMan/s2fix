name: build

# Every push and pull request builds the fixes and runs the sort test. A version tag (v0.1.0) also creates a draft
# release with the zip, to be tested in game before it is published.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The compiler the releases are built and tested with: WinLibs GCC 16.2.0, POSIX threads, MSVCRT, r2.
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip
      WINLIBS_SHA256: 1b90ec73c96e6905a913746b56fb6b20122422787029810d3afc6a3b440f2322
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the compiler
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "$WINLIBS_URL"
          echo "$WINLIBS_SHA256  $RUNNER_TEMP/winlibs.zip" | sha256sum -c -
          7z x -y -bd -o"$RUNNER_TEMP/winlibs" "$RUNNER_TEMP/winlibs.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/winlibs/mingw64/bin" >> "$GITHUB_PATH"

      - name: Sort test
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -I. -o "$RUNNER_TEMP/test_itemsort.exe" tests/test_itemsort.c
          "$RUNNER_TEMP/test_itemsort.exe"

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}" ./package.sh
          sha256sum dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s2fix
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s2fix
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "s2fix $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_REF_NAME ($GITHUB_SHA) with WinLibs GCC 16.2.0. Unzip into the game folder, next to shogun2_complete_edition.exe; see the README."
