name: build

# Every push and pull request builds the fixes for both games and runs the sort tests. A version tag (v0.2.0) also creates
# a draft release with both zips, to be tested in game before it is published. Tags with "pre-release" in their name go
# to pre-release.yml instead.
on:
  push:
    branches: [main]
    tags: ['v*', '!*pre-release*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s2fix
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "s2fix $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_REF_NAME ($GITHUB_SHA) with WinLibs GCC 16.2.0. s2fix_shogun2_complete-edition is for Shogun 2 - Complete Edition (unzip next to shogun2_complete_edition.exe), s2fix_shogun2_original for the original Shogun 2 (unzip next to Shogun2.exe); see the README."
