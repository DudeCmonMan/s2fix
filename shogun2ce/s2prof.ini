[device]
; 1 creates the D3D11 device without D3D11_CREATE_DEVICE_SINGLETHREADED; the overhaul's deferred contexts need it.
multithreaded_device=1
; 1 hands the game forwarding wrappers of the device and context; the overhaul was tested with it on.
wrap_context=1
[cpu]
; CCD for the game's threads: off (Windows decides), cache (largest L3: an X3D chip's V-Cache CCD; no effect elsewhere), or a CCD number.
ccd=cache
[s2prof]
; 1 opens a window showing the log live.
console=0
; 1 skips the warning shown when the game's engine is not the build s2fix targets (for example, another mod changed it).
ignore_build_check=0
