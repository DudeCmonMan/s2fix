[device]
; 1 creates a multithreaded D3D11 device, which the overhaul's deferred contexts need.
multithreaded_device=1
; 1 hands the game forwarding wrappers of the device and context; keep it on with the overhaul.
wrap_context=1
[cpu]
; CPUs the game's threads use with Apply Fixes on: auto, a cache group number (0 holds CPU 0), or off (Windows decides).
ccd=auto
[s2prof]
; 1 opens a window showing the log live.
console=0
; 1 skips the warning when the game's engine is not the build s2fix targets, such as when another mod changed it.
ignore_build_check=0
[campthrottle]
; How many times a second each of your settlements on the campaign map checks whether it can build something (fixes\campthrottle.dll). A whole number, 1 or more; the default is 30. Lower gives more frames on a large empire, and the answer can be up to that fraction of a second old. 0 turns this off and checks every frame, as the game does. Read at start.
hz=30
[camplabels]
; How many times a second the label of each of your settlements on the campaign map checks whether a rebellion is imminent while the camera moves (fixes\camplabels.dll). A whole number, 1 or more; the default is 30. The answer can be up to that fraction of a second old. 0 checks every frame, as the game does. Other factions' labels skip the check either way, since the game discards its answer for them. Read at start.
hz=30
